name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or destroy"
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  contents: read
  id-token: write # required for OIDC to AWS

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_DIR: terraform/envs/prod
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.9.8"

# One infra run at a time (Terraform state safety); PR runs are cancellable.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'infra-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests (Docker build target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pytest inside the image build
        run: docker build --target test -t app-test app

  validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate (no backend)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    name: Terraform plan (PR preview)
    if: github.event_name == 'pull_request'
    needs: [test, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=devops-challenge/prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_BUCKET }}-lock"
      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -lock=false -no-color -var image_tag=pr-${GITHUB_SHA::8}

  deploy:
    name: Build, push and deploy
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    needs: [test, validate]
    runs-on: ubuntu-latest
    environment: production # add required reviewers in repo settings for a manual approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # so `terraform output -raw` is clean

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=devops-challenge/prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_BUCKET }}-lock"

      - name: Provision ECR first (registry must exist before the first push)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -target=module.ecr -var image_tag=${IMAGE_TAG}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          ECR_URL=$(cd ${TF_DIR} && terraform output -raw ecr_repository_url)
          docker build --target runtime --build-arg APP_VERSION=${IMAGE_TAG} -t "${ECR_URL}:${IMAGE_TAG}" app
          docker push "${ECR_URL}:${IMAGE_TAG}"

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -out=tfplan -var image_tag=${IMAGE_TAG}

      - name: Terraform apply (rolling ECS deployment)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Wait for ECS service to stabilise
        run: |
          CLUSTER=$(cd ${TF_DIR} && terraform output -raw ecs_cluster)
          SERVICE=$(cd ${TF_DIR} && terraform output -raw ecs_service)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Smoke test
        run: |
          URL=$(cd ${TF_DIR} && terraform output -raw app_url)
          for i in $(seq 1 12); do
            if curl -fsS "$URL/health"; then echo; echo "Smoke test passed: $URL"; exit 0; fi
            echo "Attempt $i failed, retrying in 10s..."; sleep 10
          done
          echo "Smoke test failed"; exit 1

      - name: Summary
        run: |
          echo "### Deployed \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $(cd ${TF_DIR} && terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy infrastructure
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=devops-challenge/prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_BUCKET }}-lock"
          terraform destroy -input=false -auto-approve -var image_tag=destroy
