<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#fff"/>
  <text x="500" y="26" text-anchor="middle" font-size="18" font-weight="bold">ECS on EC2 Platform: Architecture (AWS us-east-1)</text>

  <!-- CI/CD -->
  <rect x="20" y="50" width="250" height="330" rx="8" fill="#f3f0ff" stroke="#6b4fbb"/>
  <text x="145" y="72" text-anchor="middle" font-weight="bold">CI/CD (GitHub Actions)</text>
  <rect x="40" y="90" width="210" height="50" rx="6" fill="#fff" stroke="#6b4fbb"/><text x="145" y="120" text-anchor="middle">Developer → GitHub repo</text>
  <rect x="40" y="165" width="210" height="75" rx="6" fill="#fff" stroke="#6b4fbb"/>
  <text x="145" y="188" text-anchor="middle" font-weight="bold">Workflow (OIDC → AWS)</text>
  <text x="145" y="208" text-anchor="middle">Test → Validate → Build</text>
  <text x="145" y="226" text-anchor="middle">Push → Apply → Smoke</text>
  <rect x="40" y="265" width="210" height="45" rx="6" fill="#fff" stroke="#6b4fbb"/><text x="145" y="292" text-anchor="middle">S3 + DynamoDB (TF state)</text>
  <rect x="40" y="320" width="210" height="45" rx="6" fill="#fff" stroke="#6b4fbb"/><text x="145" y="347" text-anchor="middle">ECR (immutable SHA tags)</text>
  <line x1="145" y1="140" x2="145" y2="165" stroke="#334" marker-end="url(#a)"/>
  <line x1="145" y1="240" x2="145" y2="265" stroke="#334" marker-end="url(#a)"/>

  <!-- Internet -->
  <rect x="330" y="50" width="120" height="40" rx="20" fill="#eef" stroke="#334"/><text x="390" y="75" text-anchor="middle">Internet users</text>

  <!-- VPC -->
  <rect x="300" y="110" width="680" height="400" rx="8" fill="#f6fbf6" stroke="#2e7d32" stroke-width="2"/>
  <text x="320" y="132" font-weight="bold" fill="#2e7d32">VPC 10.20.0.0/16</text>

  <rect x="320" y="145" width="640" height="105" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="4"/>
  <text x="335" y="163" fill="#2e7d32">Public subnets (2 AZs)</text>
  <rect x="440" y="175" width="200" height="55" rx="6" fill="#fff" stroke="#2e7d32"/><text x="540" y="198" text-anchor="middle" font-weight="bold">Application Load Balancer</text><text x="540" y="216" text-anchor="middle">HTTP :80, /health checks</text>
  <rect x="740" y="175" width="190" height="55" rx="6" fill="#fff" stroke="#2e7d32"/><text x="835" y="198" text-anchor="middle" font-weight="bold">NAT Gateway</text><text x="835" y="216" text-anchor="middle">egress for pulls/logs</text>
  <rect x="335" y="175" width="90" height="55" rx="6" fill="#fff" stroke="#2e7d32"/><text x="380" y="207" text-anchor="middle">IGW</text>

  <rect x="320" y="275" width="640" height="150" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-dasharray="4"/>
  <text x="335" y="293" fill="#1565c0">Private subnets (2 AZs)</text>
  <rect x="345" y="305" width="590" height="100" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="640" y="327" text-anchor="middle" font-weight="bold">ECS Service on EC2 capacity provider (ASG) · rolling deploy + rollback</text>
  <rect x="380" y="345" width="130" height="45" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="445" y="372" text-anchor="middle">EC2+Docker AZ-a</text>
  <rect x="580" y="345" width="130" height="45" rx="6" fill="#e3f2fd" stroke="#1565c0"/><text x="645" y="372" text-anchor="middle">EC2+Docker AZ-b</text>
  <rect x="770" y="345" width="130" height="45" rx="6" fill="#f5f5f5" stroke="#1565c0" stroke-dasharray="3"/><text x="835" y="372" text-anchor="middle">ASG 2–4 hosts</text>

  <!-- Observability -->
  <rect x="320" y="440" width="640" height="60" rx="6" fill="#fff8e1" stroke="#ef6c00"/>
  <text x="640" y="460" text-anchor="middle" font-weight="bold" fill="#ef6c00">CloudWatch</text>
  <text x="640" y="480" text-anchor="middle">Logs (awslogs) · Container Insights · Alarms (CPU, mem, 5xx, unhealthy, app errors) · Dashboard → SNS email</text>

  <!-- flows -->
  <line x1="390" y1="90" x2="390" y2="145" stroke="#334" marker-end="url(#a)"/>
  <line x1="425" y1="202" x2="440" y2="202" stroke="#334"/>
  <line x1="540" y1="230" x2="540" y2="305" stroke="#334" marker-end="url(#a)"/>
  <line x1="835" y1="305" x2="835" y2="230" stroke="#334" stroke-dasharray="4" marker-end="url(#a)"/>
  <line x1="640" y1="405" x2="640" y2="440" stroke="#ef6c00" marker-end="url(#a)"/>
  <path d="M250 342 H285 V560 H835 V405" fill="none" stroke="#334" stroke-dasharray="4" marker-end="url(#a)"/>
  <text x="560" y="578" text-anchor="middle" font-size="12">image pull (via NAT)</text>
  <path d="M250 202 H285 V500 H300" fill="none" stroke="#6b4fbb" marker-end="url(#a)" opacity="0"/>
  <text x="145" y="410" text-anchor="middle" font-size="12" fill="#6b4fbb">terraform apply → VPC, ALB, ECS, CloudWatch</text>
  <text x="500" y="620" text-anchor="middle" font-size="12" fill="#555">Security: Internet → ALB SG (80) → Instance SG (ephemeral ports from ALB SG only). Hosts have no public IPs.</text>
</svg>
